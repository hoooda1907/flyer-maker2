name: Build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: node scripts/prepare.js
      - run: npx cap add android && npx cap sync android
      - name: App icon
        run: |
          sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for e in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${e%%:*}; z=${e##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do convert build/icon.png -resize ${z}x${z} $R/mipmap-$n/$f.png; done
          done
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: RMT-Flyer-Maker-apk, path: android/app/build/outputs/apk/debug/*.apk}
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: {name: RMT-Flyer-Maker-Setup, path: dist/*.exe}
